[tool.ruff]
line-length = 100
target-version = "py313"
# Minty: shared CI checked it out beside this repo (python-api.yml) before minty-db was pinned.
exclude = [".venv", "logs", "Minty"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  # long docstrings and comments are the house style (see the other Django services)
  "E501",
  # hub/policy.py is a verbatim copy of the other services' policy (str, Enum); StrEnum would be a
  # behaviour change to review in all of them together (minty-subscription-api ignores it too)
  "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "hub", "xero"]
